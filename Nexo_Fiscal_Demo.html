function chartSVG(){const vals=ui.chartPeriod==='12m'?[35,44,40,50,46,57,52,65,62,74,72,88]:ui.chartPeriod==='3m'?[57,69,63,75,71,90]:[33,47,41,57,52,65,63,80,73,85,82,94];const rec=vals.map((v,i)=>v*.52+8+(i%4)*3);const max=120, W=740,H=214,pad=28;const points=arr=>arr.map((v,i)=>`${pad+i*(W-pad*2)/(arr.length-1)},${H-(v/max)*(H-18)}`).join(' ');const xy=points(vals).split(' ');const yy=points(rec).split(' ');const months=ui.chartPeriod==='12m'?['NOV','DIC','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT']:ui.chartPeriod==='3m'?['AGO 1','AGO 15','SEP 1','SEP 15','OCT 1','OCT 11']:['MAY','MAY','JUN','JUN','JUL','JUL','AGO','AGO','SEP','SEP','OCT','OCT'];return `<svg class="chart-svg" viewBox="0 0 740 267" role="img" aria-label="Gráfica demostrativa de emisión y recepción a lo largo del periodo"><defs><linearGradient id="areaPurple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8678ef" stop-opacity=".17"/><stop offset="1" stop-color="#8678ef" stop-opacity="0"/></linearGradient></defs>${[45,93,141,189].map(y=>`<line x1="28" y1="${y}" x2="730" y2="${y}" stroke="var(--border)" stroke-dasharray="4 6"/>`).join('')}<polygon points="${xy.join(' ')} 712,214 28,214" fill="url(#areaPurple)"/><polyline points="${yy.join(' ')}" fill="none" stroke="#63c9ac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${xy.join(' ')}" fill="none" stroke="#7769e6" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((p,i)=>i===xy.length-1?`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="6" fill="#7769e6" stroke="var(--surface)" stroke-width="3"/>`:'').join('')}${months.map((m,i)=>i%2===0?`<text x="${28+i*(684/(months.length-1))}" y="250" text-anchor="middle">${m}</text>`:'').join('')}</svg>`}

function pacView(){const rs=currentReqs();const complete=rs.filter(r=>r.state==='Completada');return `${pageHeading('Operaciones PAC','Supervisa el flujo de validación y certificación en una única interfaz.',`<button class="btn btn-secondary" data-action="nav" data-value="solicitudes">${I('send','sm')} Ver solicitudes</button>`)}<div class="message warning" style="margin-bottom:18px">${I('shield')} No existe un PAC configurado. Las operaciones de esta pantalla representan únicamente el flujo de UX. No se generan sellos, timbres ni CFDI válidos.</div><div class="grid-4" style="margin-bottom:18px"><div class="panel kpi"><span class="kpi-label">Operaciones finalizadas</span><strong class="kpi-value">${complete.length}</strong><p class="kpi-note">Solo en demostración</p></div><div class="panel kpi"><span class="kpi-label">Listas para procesar</span><strong class="kpi-value">${rs.filter(r=>r.state==='Aprobada').length}</strong><p class="kpi-note">Solicitudes aprobadas</p></div><div class="panel kpi"><span class="kpi-label">Conector activo</span><strong class="kpi-value">0</strong><p class="kpi-note">PAC reales configurados</p></div><div class="panel kpi"><span class="kpi-label">Modo de ejecución</span><strong class="kpi-value" style="font-size:19px">Simulado</strong><p class="kpi-note">Sin servicios externos</p></div></div><div class="integration-grid"><div class="panel integration-card"><div class="integration-logo">${I('shield','lg')}</div><h3>Adaptador de certificación</h3><p>Conecta un proveedor autorizado sin afectar el diseño de solicitudes, estados, validaciones o reintentos.</p><div class="integration-foot"><span>${statusBadge('No conectado')}</span><button class="btn btn-secondary btn-sm" data-action="pac-info">Ver preparación ${I('right','sm')}</button></div></div><div class="panel integration-card"><div class="integration-logo">${I('grid','lg')}</div><h3>Operaciones y persistencia</h3><p>El futuro backend PostgreSQL será responsable de las solicitudes, respues function reportsView(){const docs=currentDocs();const issued=docs.filter(d=>d.direction==='Emitido'&&d.status==='Vigente');const received=docs.filter(d=>d.direction==='Recibido'&&d.status==='Vigente');const s1=issued.reduce((s,d)=>s+d.total,0),s2=received.reduce((s,d)=>s+d.total,0);const totals=scopedClients().map(c=>({...c,sum:docs.filter(d=>d.clientId===c.id).reduce((s,d)=>s+d.total,0),count:docs.filter(d=>d.clientId===c.id).length})).sort((a,b)=>b.sum-a.sum);return `${pageHeading('Reportes e indicadores','Visualización y exploración de información fiscal sintética.',`<button class="btn btn-secondary" data-action="csv-cfdi">${I('download','sm')} Exportar datos CSV</button>`)}<div class="message" style="margin-bottom:18px">${I('chart')} Indicadores para evaluar la experiencia de usuario. Los importes no representan obligaciones, impuestos determinados ni información real del SAT.</div><section class="panel panel-pad"><div class="panel-head"><div><h3>Volumen de operaciones</h3><small>Comparativa visual de periodos · Datos de prueba</small></div><span class="date-pill">${I('calendar','sm')} May – Oct 2026</span></div><div class="bar-chart">${[42,55,51,67,60,86].map((x,i)=>`<div class="bar-col"><div class="bar-bars"><div class="bar" style="height:${x}%" title="Emitidos"></div><div class="bar second" style="height:${Math.round(x*.7)}%" title="Recibidos"></div></div><span>${['MAY','JUN','JUL','AGO','SEP','OCT'][i]}</span></div>`).join('')}</div><div class="chart-legend" style="justify-content:center;margin-top:15px"><span><i class="dot"></i> Emitidos</span><span><i class="dot mint"></i> Recibidos</span></div></section><div class="report-metrics" style="margin-top:16px"><div class="panel metric-strip"><small>Importe de CFDI emitidos</small><strong>${money(s1,true)}</strong></div><div class="panel metric-strip"><small>Importe de CFDI recibidos</small><strong>${money(s2,true)}</strong></div><div class="panel metric-strip"><small>CFDI analizados</small><strong>${docs.length}</strong></div></div><section class="panel panel-pad report-table"><div class="panel-head"><h3>Distribución por contribuyente</h3><small>Desglose de documentos disponibles</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>CONTRIBUYENTE</th><th>DOCUMENTOS</th><th>IMPORTE TOTAL</th><th>PARTICIPACIÓN</th></tr></thead><tbody>${totals.map(c=>`<tr data-action="client-detail" data-value="${c.id}"><td><div class="client-cell">${logoForClient(c)}<strong>${escapeHTML(c.name)}</strong></div></td><td>${c.count}</td><td><strong>${money(c.sum)}</strong></td><td><div class="progress-line" style="width:125px"><b style="width:${(c.sum/Math.max(...totals.map(x=>x.sum),1)*100).toFixed(1)}%"></b></div></td></tr>`).join('')}</tbody></table></div></section>`}
function teamView(){return `${pageHeading('Equipo de trabajo','Asigna responsables y prepara la colaboración en organizaciones.',`<button class="btn btn-primary" data-action="team-new">${I('plus','sm')} Invitar colaborador</button>`)}<div class="message" style="margin-bottom:18px">${I('lock')} La asignación de roles es únicamente visual en este MVP. Los permisos reales se validarán en el backend antes de operar con información fiscal.</div><section class="panel panel-pad"><div class="panel-head"><h3>Miembros del equipo</h3><small>${data.team.length} registros de prueba</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PERSONA</th><th>CORREO</th><th>ROL</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead><tbody>${data.team.map(u=>`<tr><td><div class="client-cell">${avatar(u.name)}<strong>${escapeHTML(u.name)}</strong></div></td><td>${escapeHTML(u.email)}</td><td>${escapeHTML(u.role)}</td><td>${statusBadge(u.status)}</td><td><button class="btn btn-quiet btn-sm" data-action="team-member" data-value="${u.id}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div></section><div class="grid-2" style="margin-top:18px"><div class="panel panel-pad"><div class="panel-head"><h3>Modelo de permisos</h3></div><div class="mini-list">${[['Administrador','Gestión de miembros y espacios'],['Contador','Clientes y solicitudes asignadas'],['Auxiliar contable','Preparación y revisión'],['Cliente','Operaciones propias autorizadas']].map(x=>`<div class="mini-list-row"><strong>${x[0]}</strong><small style="margin:0">${x[1]}</small></div>`).join('')}</div></div><div class="panel panel-pad"><div class="panel-head"><h3>Separación de acceso</h3></div><p style="font-size:12px;color:var(--muted-2);line-height:1.9">Una identidad puede colaborar con varias organizaciones, pero solo debe ver los contribuyentes para los que tenga autorización vigente. El selector de contexto hará explícita esta separación.</p><div style="margin-top:20px">${statusBadge('Diseño definido lass="panel integration-card"><span class="integration-logo">${I('shield','lg')}</span><h3>PAC / PostgreSQL</h3><p>Solicitudes, cuentas, permisos, operaciones de certificación, estados y trazabilidad transaccional.</p><div class="integration-foot"><span>${statusBadge('Sin conectar')}</span><button class="btn btn-secondary btn-sm" data-action="integration-info" data-value="pac">Arquitectura ${I('right','sm')}</button></div></section></div><div class="message" style="margin-top:18px">${I('shield')} Próxima fase: identidad real, servicios de backend, aislamiento multiempresa y custodia criptográfica de certificados. No se solicita información sensible en esta demo.</div>`}
function formatInput(name,value='',type='text',placeholder='',extra=''){return `<input class="field" type="${type}" name="${name}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" ${extra} />`}
function taxpayerOptions(selected){return scopedClients().map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${escapeHTML(c.name)} · ${escapeHTML(c.rfc)}</option>`).join('')}
function modal(title,desc,body,foot='',wide=false){return `<div class="scrim" data-action="overlay-close"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}" data-stop="true"><header class="modal-head"><div><h2>${title}</h2><p>${desc}</p></div>${iconButton('close','close','Cerrar')}</header>${body}${foot}</section></div>`}

ackend. Explora los comprobantes demo.');break;case'reset-demo':{if(!confirm('¿Restablecer todos los datos de demostración? Se perderán tus cambios locales.'))return;data=clone(INITIAL);persist();ui.taxpayerId='';render();toast('Datos de prueba restablecidos');break}default:break}}
function handleForm(form){const name=form.dataset.form;const raw=Object.fromEntries(new FormData(form).entries());if(name==='login'){toast('El acceso seguro aún no está conectado. Usa un perfil demo.',true);return}if(name==='register'){const role=raw.role;const org=raw.org.trim(),name=raw.name.trim();const id='custom-'+Date.now();const custom={role,custom:true,workspaceId:id,org,name,email:raw.email,label:DEMO_PROFILES[role]?.label||'Mi espacio',icon:DEMO_PROFILES[role]?.icon||'person'};data.clients.push({id:`c${Date.now()}`,workspaceId:id,name:org,rfc:'PENDIENTE',type:role==='personal'?'Persona física':'Persona moral',sector:role==='publico'?'Sector público':'Por definir',email:raw.email,responsible:name,status:'Pendiente',color:2,amount:0,city:'Por definir',sync:'—'});persist();enter(role,custom);return}if(name==='client-add'){const r=raw.rfc.trim().toUpperCase();if(!/^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$/.test(r)){toast('Introduce un RFC con formato general de 12 o 13 caracteres',true);return}if(data.clients.some(c=>c.rfc===r&&canSeeClient(c))){toast('El RFC ya existe en tu cartera de prueba',true);return}data.clients.unshift({id:'c'+Date.now(),name:raw.name.trim(),rfc:r,type:raw.type,sector:raw.sector||'Sin definir',email:raw.email||'—',responsible:raw.responsible||profile.name,status:raw.status,color:data.clients.length%colors.length,amount:0,city:'México',sync:'—',...(profile.custom?{workspaceId:profile.workspaceId}:{})});persist();closeAll();render();toast('Contribuyente agregado a la cartera de prueba');return}if(name==='team-add'){data.team.push({id:'u'+Date.now(),name:raw.name.trim(),email:raw.email,role:raw.role,status:'Invitado'});persist();closeAll();render();toast('Invitación de prueba registrada. No se envió correo.');return}if(name==='job-add'){if(raw.start>raw.end){toast('La fecha de inicio debe ser anterior al cierre',true);return}const id='SYNC-'+String(Date.now()).slice(-6);data.jobs.unshift({id,clientId:raw.clientId,type:raw.type,start:raw.start,end:raw.end,status:'Pendiente',count:0,created:new Date().toISOString().slice(0,10)});persist();closeAll();ui.view='sat';render();toast(`Solicitud ${id} registrada. Puedes simular su ejecución.`);return}if(name==='request-step'){if(!ui.wizard)return;const w=ui.wizard;if(w.step===1){w.clientId=raw.clientId;w.kind=raw.kind;w.step=2;renderOverlay();return}if(w.step===2){w.description=raw.description.trim();w.amount=Number(raw.amount);w.notes=raw.notes||'';if(!w.description||!(w.amount>0)){toast('Completa el concepto y un importe válido',true);return}w.step=3;renderOverlay();return}if(w.step===3){const id='SOL-'+String(Date.now()).slice(-7);data.requests.unshift({id,clientId:w.clientId,title:w.description,amount:Number(w.amount),state:'Pendiente',date:new Date().toISOString().slice(0,10),requester:profile.name});persist();closeAll();ui.view='solicitudes';render();toast(`Solicitud ${id} creada correctamente en la demo.`)}}}
// One delegated event layer keeps the prototype dependency-free.
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button){if(ui.popover&&!e.target.closest('.floating-popover')){ui.popover=null;renderOverlay()}return}const action=button.dataset.action;if(action==='overlay-close'&&e.target!==button)return;const value=button.dataset.value||'';e.preventDefault();handleAction(action,value,button)});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();handleForm(form)});
document.addEventListener('change',e=>{const filter=e.target.dataset.filter;if(filter==='clients'){ui.clientFilter=e.target.value;refreshContent()}if(filter==='cfdi'){ui.cfdiType=e.target.value;refreshContent()}});
document.addEventListener('input',e=>{if(e.target.id==='global-find'){ui.searchGlobal=e.target.value;const pos=e.target.selectionStart;renderOverlay();const next=$('#global-find');next?.focus();next?.setSelectionRange(pos,pos);return}if(e.target.dataset.search){const pos=e.target.selectionStart;const type=e.target.dataset.search;ui.search=e.target.value;refreshContent();const input=$(`[data-search="${type}"]`);input?.focus();input?.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal||ui.drawer||ui.popover){closeAll();e.preventDefault()}else if(ui.mobileOpen){ui.mobileOpen=false;render()}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&profile){e.preventDefault();handleAction('search-global')}});
render();
})();

</script>
